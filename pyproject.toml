[project]
name = "medienpaed-reader"
version = "0.3.0"
description = "Volltext-RSS-Feed und Readwise-Push fuer Artikel der Zeitschrift MedienPaedagogik"
readme = "README.md"
authors = [
    { name = "Jan Vanvinkenroye", email = "jan@vanvinkenroye.de" }
]
requires-python = ">=3.12"
dependencies = [
    "docling>=2.40",
    "feedgen>=1.0",
    "feedparser>=6.0",
    "flask>=3.0",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "selectolax>=0.3",
    "torch>=2.2",
    "torchvision>=0.17",
    "trafilatura>=2.2.0",
    "typer>=0.12",
    "waitress>=3.0",
]

[project.scripts]
medienpaed-reader = "medienpaed_reader.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: langsame Integrationstests (docling), Aufruf mit -m slow"]
addopts = "-m 'not slow'"

# Auf Linux (Docker) CPU-only-Torch: spart ueber 3 GB CUDA-Bibliotheken im Image.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
